<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Wide Mediterranean Sky -->
    <linearGradient id="wideSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a5e" />
      <stop offset="35%" stop-color="#145d6d" />
      <stop offset="70%" stop-color="#2d7a8a" />
      <stop offset="100%" stop-color="#70aeb8" />
    </linearGradient>

    <!-- Limassol Coastline Shimmer (400m to beach) -->
    <linearGradient id="seaCoast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="wideConcrete" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="wideGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Mediterranean Sky -->
  <rect width="1600" height="1000" fill="url(#wideSky)" />

  <!-- Soft Summer Cumulus Clouds -->
  <path d="M 0,220 Q 300,190 650,210 T 1300,200 L 1600,220 L 1600,500 L 0,500 Z" fill="#c3e4ea" opacity="0.4" />

  <!-- Flock of Birds Flying across Limassol Sky -->
  <!-- Bird 1 -->
  <path d="M 640,110 Q 646,102 652,110 Q 658,102 664,110" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <!-- Bird 2 -->
  <path d="M 690,130 Q 695,123 700,130 Q 705,123 710,130" fill="none" stroke="#0f172a" stroke-width="2" />
  <!-- Bird 3 -->
  <path d="M 725,100 Q 730,94 735,100 Q 740,94 745,100" fill="none" stroke="#0f172a" stroke-width="2" />
  <!-- Bird 4 -->
  <path d="M 780,140 Q 784,135 788,140 Q 792,135 796,140" fill="none" stroke="#0f172a" stroke-width="1.8" />
  <!-- Bird 5 -->
  <path d="M 810,115 Q 815,110 820,115 Q 825,110 830,115" fill="none" stroke="#0f172a" stroke-width="2" />
  <!-- Bird 6 -->
  <path d="M 860,150 Q 864,145 868,150 Q 872,145 876,150" fill="none" stroke="#0f172a" stroke-width="1.5" />

  <!-- Distant Troodos Mountain Range in Horizon -->
  <polygon points="0,320 250,290 580,310 920,295 1300,315 1600,300 1600,450 0,450" fill="#2d606c" opacity="0.45" />

  <!-- Limassol Potamos Germasogeias Urban Landscape (Background City Grid) -->
  <!-- Distant Residential Blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="20" y="360" width="80" height="70" />
    <rect x="120" y="370" width="70" height="60" />
    <rect x="210" y="350" width="90" height="80" />
    <rect x="320" y="365" width="75" height="65" />
    <rect x="1150" y="360" width="100" height="80" fill="#f8fafc" />
    <rect x="1280" y="350" width="120" height="90" fill="#fed7aa" />
    <rect x="1420" y="365" width="140" height="80" fill="#f1f5f9" />
  </g>

  <!-- Midground Limassol Neighborhood (Apartments & Villas) -->
  <!-- Left Neighboring Apartment Complex -->
  <polygon points="180,390 340,390 340,680 180,680" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="340,390 380,410 380,680 340,680" fill="#e2e8f0" />
  <g fill="#64748b">
    <rect x="205" y="440" width="40" height="30" />
    <rect x="270" y="440" width="40" height="30" />
    <rect x="205" y="500" width="40" height="30" />
    <rect x="270" y="500" width="40" height="30" />
    <rect x="205" y="560" width="40" height="30" />
    <rect x="270" y="560" width="40" height="30" />
  </g>

  <!-- Right Neighboring Complex (Terracotta / Sandstone) -->
  <polygon points="660,370 820,370 820,800 660,800" fill="#ffedd5" />
  <polygon points="820,370 880,390 880,800 820,800" fill="#fed7aa" />
  <!-- Far Right Modern Complex -->
  <polygon points="900,390 1020,390 1020,700 900,700" fill="#f8fafc" />
  <polygon points="1020,390 1080,410 1080,700 1020,700" fill="#e2e8f0" />

  <!-- Urban Greenery & Coastal Palm Trees -->
  <g fill="#15803d">
    <ellipse cx="140" cy="520" rx="35" ry="60" />
    <ellipse cx="160" cy="650" rx="40" ry="70" />
    <ellipse cx="360" cy="720" rx="45" ry="50" fill="#166534" />
    <ellipse cx="850" cy="740" rx="40" ry="50" />
    <ellipse cx="960" cy="760" rx="45" ry="40" fill="#14532d" />
  </g>

  <!-- ==================================================== -->
  <!-- CENTERPIECE: GERMASOGEIA CORPORATE PRIME HEADQUARTERS -->
  <!-- ==================================================== -->

  <!-- Rooftop Lift Core / Plant Structure -->
  <polygon points="560,190 850,190 880,260 590,260" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="850,190 940,215 960,275 880,260" fill="#e2e8f0" />

  <!-- Top Crown Parapet & Roof Deck Cantilever -->
  <polygon points="450,270 990,270 1040,335 490,335" fill="url(#wideConcrete)" />
  <polygon points="490,335 1040,335 1040,350 490,350" fill="#94a3b8" />

  <!-- 4TH FLOOR -->
  <polygon points="495,350 830,350 830,445 495,445" fill="url(#wideGlass)" />
  <polygon points="830,350 1030,350 1020,445 830,445" fill="url(#wideGlass)" />
  <!-- Mullions -->
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="560" y1="350" x2="560" y2="445" />
    <line x1="630" y1="350" x2="630" y2="445" />
    <line x1="700" y1="350" x2="700" y2="445" />
    <line x1="770" y1="350" x2="770" y2="445" />
    <line x1="890" y1="350" x2="890" y2="445" />
    <line x1="960" y1="350" x2="960" y2="445" />
  </g>
  <!-- Floor 4 Cantilever Fin Slab -->
  <polygon points="470,440 1030,440 1045,460 490,460" fill="url(#wideConcrete)" />
  <polygon points="490,460 1045,460 1045,470 490,470" fill="#94a3b8" />

  <!-- 3RD FLOOR -->
  <polygon points="495,470 830,470 830,555 495,555" fill="url(#wideGlass)" />
  <polygon points="830,470 1030,470 1020,555 830,555" fill="url(#wideGlass)" />
  <!-- Mullions -->
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="560" y1="470" x2="560" y2="555" />
    <line x1="630" y1="470" x2="630" y2="555" />
    <line x1="700" y1="470" x2="700" y2="555" />
    <line x1="770" y1="470" x2="770" y2="555" />
    <line x1="890" y1="470" x2="890" y2="555" />
    <line x1="960" y1="470" x2="960" y2="555" />
  </g>
  <!-- Floor 3 Cantilever Fin Slab -->
  <polygon points="470,550 1030,550 1045,570 490,570" fill="url(#wideConcrete)" />
  <polygon points="490,570 1045,570 1045,580 490,580" fill="#94a3b8" />

  <!-- 2ND FLOOR -->
  <polygon points="495,580 830,580 830,665 495,665" fill="url(#wideGlass)" />
  <polygon points="830,580 1030,580 1020,665 830,665" fill="url(#wideGlass)" />
  <!-- Mullions -->
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="560" y1="580" x2="560" y2="665" />
    <line x1="630" y1="580" x2="630" y2="665" />
    <line x1="700" y1="580" x2="700" y2="665" />
    <line x1="770" y1="580" x2="770" y2="665" />
    <line x1="890" y1="580" x2="890" y2="665" />
    <line x1="960" y1="580" x2="960" y2="665" />
  </g>
  <!-- Floor 2 Cantilever Fin Slab -->
  <polygon points="470,660 1030,660 1045,680 490,680" fill="url(#wideConcrete)" />
  <polygon points="490,680 1045,680 1045,690 490,690" fill="#94a3b8" />

  <!-- 1ST FLOOR / MEZZANINE -->
  <polygon points="495,690 830,690 830,775 495,775" fill="url(#wideGlass)" />
  <polygon points="830,690 1030,690 1020,775 830,775" fill="url(#wideGlass)" />
  <polygon points="450,770 1030,770 1045,790 490,790" fill="url(#wideConcrete)" />

  <!-- GROUND LEVEL / PILOTIS / PARKING BAYS -->
  <polygon points="480,790 990,790 990,890 480,890" fill="#1e293b" />
  <rect x="520" y="790" width="24" height="95" fill="#94a3b8" />
  <rect x="700" y="790" width="24" height="95" fill="#94a3b8" />
  <rect x="850" y="790" width="24" height="95" fill="#94a3b8" />

  <!-- Neighborhood Street & Cars -->
  <polygon points="0,780 1600,700 1600,1000 0,1000" fill="#334155" />
  <!-- Parked vehicles -->
  <rect x="1200" y="860" width="60" height="30" rx="6" fill="#09090b" />
  <rect x="1275" y="820" width="55" height="28" rx="5" fill="#f8fafc" />

  <!-- Overlay Watermark Tag -->
  <rect x="36" y="36" width="370" height="42" fill="#090d16" opacity="0.85" rx="4" />
  <text x="52" y="63" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#10b981" letter-spacing="1.5">
    POTAMOS GERMASOGEIAS PANORAMA
  </text>
</svg>
