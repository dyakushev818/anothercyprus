<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Drone Mediterranean Teal Sky -->
    <linearGradient id="droneSkyTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e4e61" />
      <stop offset="40%" stop-color="#15616d" />
      <stop offset="80%" stop-color="#3c8894" />
      <stop offset="100%" stop-color="#69abb3" />
    </linearGradient>

    <!-- Glazing Real Reflection -->
    <linearGradient id="droneGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e3a47" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Concrete Deck -->
    <linearGradient id="droneConcrete" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Mediterranean Teal Sky Background -->
  <rect width="1600" height="1000" fill="url(#droneSkyTeal)" />

  <!-- Soft White Clouds -->
  <path d="M 0,280 Q 200,240 450,260 T 900,240 T 1400,270 L 1600,280 L 1600,600 L 0,600 Z" fill="#bfe1e6" opacity="0.35" />

  <!-- Distant Troodos Mountain Ridgeline & Limassol Skyline -->
  <polygon points="1200,320 1350,300 1500,325 1600,310 1600,450 1200,450" fill="#2d6470" opacity="0.6" />

  <!-- Surrounding Potamos Germasogeias Buildings (Left) -->
  <!-- White Modern Apartment Complex -->
  <polygon points="100,380 280,380 280,720 100,720" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="280,380 320,400 320,720 280,720" fill="#e2e8f0" />
  <!-- Windows & Balconies on Left Neighbor -->
  <g fill="#475569">
    <rect x="130" y="440" width="45" height="35" />
    <rect x="200" y="440" width="45" height="35" />
    <rect x="130" y="520" width="45" height="35" />
    <rect x="200" y="520" width="45" height="35" />
    <rect x="130" y="600" width="45" height="35" />
    <rect x="200" y="600" width="45" height="35" />
  </g>
  <!-- Solar Water Heaters on Adjacent Rooftops -->
  <rect x="140" y="360" width="30" height="20" fill="#64748b" />
  <circle cx="155" cy="355" r="7" fill="#cbd5e1" />
  <rect x="210" y="360" width="30" height="20" fill="#64748b" />
  <circle cx="225" cy="355" r="7" fill="#cbd5e1" />

  <!-- Surrounding Buildings (Right) -->
  <!-- Warm Terracotta & Beige Apartment Block -->
  <polygon points="680,360 840,360 840,820 680,820" fill="#fed7aa" opacity="0.9" />
  <polygon points="840,360 900,380 900,820 840,820" fill="#fdba74" />
  <!-- Modern Residential Tower (Far Right) -->
  <polygon points="910,380 1020,380 1020,720 910,720" fill="#f1f5f9" />
  <polygon points="1020,380 1090,400 1090,720 1020,720" fill="#e2e8f0" />

  <!-- Mediterranean Palm Trees & Pines Nestled Around -->
  <g fill="#166534">
    <ellipse cx="60" cy="520" rx="35" ry="70" />
    <ellipse cx="80" cy="680" rx="40" ry="80" />
    <ellipse cx="280" cy="740" rx="45" ry="60" fill="#15803d" />
    <ellipse cx="780" cy="800" rx="40" ry="40" fill="#14532d" />
    <ellipse cx="850" cy="720" rx="30" ry="60" />
  </g>

  <!-- ============================================== -->
  <!-- MAIN COMMERCIAL HEADQUARTERS (Drone Drone Shot) -->
  <!-- ============================================== -->

  <!-- Rooftop Mechanical Structure / Lift Core -->
  <polygon points="540,120 880,120 920,200 580,200" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <polygon points="880,120 980,150 1010,220 920,200" fill="#e2e8f0" />
  <!-- Rooftop Solar Panels / PV Array -->
  <polygon points="620,135 840,135 860,180 640,180" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

  <!-- Top Crown Parapet & Roof Deck Cantilever -->
  <polygon points="380,210 1080,210 1140,290 440,290" fill="url(#droneConcrete)" />
  <polygon points="380,210 440,290 440,310 380,225" fill="#64748b" />
  <polygon points="440,290 1140,290 1140,310 440,310" fill="#cbd5e1" />

  <!-- 4TH FLOOR (Top Office Suite) -->
  <polygon points="445,310 860,310 860,420 450,420" fill="url(#droneGlass)" />
  <polygon points="860,310 1120,310 1110,420 860,420" fill="url(#droneGlass)" />
  <!-- Mullion Grid Floor 4 -->
  <g stroke="#0f172a" stroke-width="3">
    <line x1="530" y1="310" x2="530" y2="420" />
    <line x1="610" y1="310" x2="610" y2="420" />
    <line x1="690" y1="310" x2="690" y2="420" />
    <line x1="770" y1="310" x2="770" y2="420" />
    <line x1="930" y1="310" x2="930" y2="420" />
    <line x1="1010" y1="310" x2="1010" y2="420" />
    <line x1="1070" y1="310" x2="1070" y2="420" />
  </g>
  <!-- Floor 4 Cantilever Fin Slab -->
  <polygon points="410,410 1120,410 1135,435 440,435" fill="url(#droneConcrete)" />
  <polygon points="440,435 1135,435 1135,445 440,445" fill="#94a3b8" />

  <!-- 3RD FLOOR -->
  <polygon points="445,445 860,445 860,550 450,550" fill="url(#droneGlass)" />
  <polygon points="860,445 1120,445 1110,550 860,550" fill="url(#droneGlass)" />
  <!-- Mullion Grid Floor 3 -->
  <g stroke="#0f172a" stroke-width="3">
    <line x1="530" y1="445" x2="530" y2="550" />
    <line x1="610" y1="445" x2="610" y2="550" />
    <line x1="690" y1="445" x2="690" y2="550" />
    <line x1="770" y1="445" x2="770" y2="550" />
    <line x1="930" y1="445" x2="930" y2="550" />
    <line x1="1010" y1="445" x2="1010" y2="550" />
    <line x1="1070" y1="445" x2="1070" y2="550" />
  </g>
  <!-- Floor 3 Cantilever Fin Slab -->
  <polygon points="410,540 1120,540 1135,565 440,565" fill="url(#droneConcrete)" />
  <polygon points="440,565 1135,565 1135,575 440,575" fill="#94a3b8" />

  <!-- 2ND FLOOR -->
  <polygon points="445,575 860,575 860,670 450,670" fill="url(#droneGlass)" />
  <polygon points="860,575 1120,575 1110,670 860,670" fill="url(#droneGlass)" />
  <!-- Mullion Grid Floor 2 -->
  <g stroke="#0f172a" stroke-width="3">
    <line x1="530" y1="575" x2="530" y2="670" />
    <line x1="610" y1="575" x2="610" y2="670" />
    <line x1="690" y1="575" x2="690" y2="670" />
    <line x1="770" y1="575" x2="770" y2="670" />
    <line x1="930" y1="575" x2="930" y2="670" />
    <line x1="1010" y1="575" x2="1010" y2="670" />
    <line x1="1070" y1="575" x2="1070" y2="670" />
  </g>
  <!-- Floor 2 Cantilever Fin Slab -->
  <polygon points="410,660 1120,660 1135,685 440,685" fill="url(#droneConcrete)" />
  <polygon points="440,685 1135,685 1135,695 440,695" fill="#94a3b8" />

  <!-- 1ST FLOOR / MEZZANINE -->
  <polygon points="445,695 860,695 860,785 450,785" fill="url(#droneGlass)" />
  <polygon points="860,695 1110,695 1100,785 860,785" fill="url(#droneGlass)" />
  <polygon points="380,780 1120,780 1140,805 440,805" fill="url(#droneConcrete)" />

  <!-- GROUND LEVEL / PILOTIS / PARKING ENTRANCE -->
  <polygon points="420,805 1060,805 1060,920 420,920" fill="#1e293b" />
  <!-- Concrete Columns Support -->
  <rect x="460" y="805" width="28" height="115" fill="#94a3b8" />
  <rect x="680" y="805" width="28" height="115" fill="#94a3b8" />
  <rect x="840" y="805" width="28" height="115" fill="#94a3b8" />

  <!-- Asphalt Road & Street Context (Bottom & Right) -->
  <polygon points="0,750 1600,680 1600,1000 0,1000" fill="#334155" />
  <polygon points="0,850 1600,780 1600,1000 0,1000" fill="#1e293b" />

  <!-- Parked Cars on Street (Drone view) -->
  <!-- Black SUV -->
  <rect x="1250" y="860" width="70" height="35" rx="8" fill="#09090b" stroke="#27272a" stroke-width="2" />
  <!-- White Sedan -->
  <rect x="1340" y="810" width="65" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />

  <!-- Overlay Watermark Tag -->
  <rect x="36" y="36" width="370" height="42" fill="#090d16" opacity="0.85" rx="4" />
  <text x="52" y="63" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#10b981" letter-spacing="1.5">
    DRONE AERIAL SURVEY (POTAMOS)
  </text>
</svg>
